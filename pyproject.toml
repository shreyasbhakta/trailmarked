[project]
name = "trailmarked"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "protobuf>=5.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "strawberry-graphql>=0.235",
    "playwright>=1.44",
    "anthropic>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*", "mock_bank_app*"]
