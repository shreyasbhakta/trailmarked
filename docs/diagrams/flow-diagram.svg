<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="60" y="86" font-size="46" font-weight="700" fill="#111827" letter-spacing="-0.5">Trailmarked</text>
  <text x="60" y="118" font-size="17" font-weight="400" fill="#6b7280">Learn once. Reuse forever.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L7 5L1 9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== Card 1: Discovery (x=112) ===== -->
  <g>
    <rect x="112" y="180" width="176" height="176" rx="14" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
    <!-- eye icon -->
    <g transform="translate(200,222)">
      <path d="M-20 0 Q0 -14 20 0 Q0 14 -20 0 Z" fill="none" stroke="#2f6fed" stroke-width="2"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#2f6fed" stroke-width="2"/>
    </g>
    <text x="200" y="270" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Discovery</text>
    <text x="200" y="294" font-size="13" fill="#6b7280" text-anchor="middle">LLM learns the task</text>
    <text x="200" y="311" font-size="13" fill="#6b7280" text-anchor="middle">once, live</text>
  </g>
  <line x1="288" y1="268" x2="306" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#chev)"/>

  <!-- ===== Card 2: Record (x=312) ===== -->
  <g>
    <rect x="312" y="180" width="176" height="176" rx="14" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
    <!-- bookmark icon -->
    <g transform="translate(400,222)">
      <path d="M-11 -15 L11 -15 L11 16 L0 6 L-11 16 Z" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="400" y="270" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Record</text>
    <text x="400" y="294" font-size="13" fill="#6b7280" text-anchor="middle">Turned into a</text>
    <text x="400" y="311" font-size="13" fill="#6b7280" text-anchor="middle">saved recipe</text>
  </g>
  <line x1="488" y1="268" x2="506" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#chev)"/>

  <!-- ===== Card 3: Registry (x=512) ===== -->
  <g>
    <rect x="512" y="180" width="176" height="176" rx="14" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
    <!-- stacked layers icon -->
    <g transform="translate(600,222)" stroke="#2f6fed" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M0 -14 L16 -6 L0 2 L-16 -6 Z"/>
      <path d="M-16 1 L0 9 L16 1"/>
      <path d="M-16 8 L0 16 L16 8"/>
    </g>
    <text x="600" y="270" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Registry</text>
    <text x="600" y="294" font-size="13" fill="#6b7280" text-anchor="middle">Versioned,</text>
    <text x="600" y="311" font-size="13" fill="#6b7280" text-anchor="middle">reviewable</text>
  </g>
  <line x1="688" y1="268" x2="706" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#chev)"/>

  <!-- ===== Card 4: Replay (x=712) ===== -->
  <g>
    <rect x="712" y="180" width="176" height="176" rx="14" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
    <!-- play icon -->
    <g transform="translate(800,222)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#2f6fed" stroke-width="2"/>
      <path d="M-5 -8 L10 0 L-5 8 Z" fill="#2f6fed"/>
    </g>
    <text x="800" y="270" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Replay</text>
    <text x="800" y="294" font-size="13" fill="#6b7280" text-anchor="middle">Runs on its own,</text>
    <text x="800" y="311" font-size="13" fill="#6b7280" text-anchor="middle">no AI involved</text>
  </g>
  <line x1="888" y1="268" x2="906" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#chev)"/>

  <!-- ===== Card 5: Escalate (x=912) ===== -->
  <g>
    <rect x="912" y="180" width="176" height="176" rx="14" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
    <!-- handoff icon -->
    <g transform="translate(1000,222)" stroke="#2f6fed" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-4" cy="-14" r="5.5"/>
      <path d="M-14 12 Q-14 -1 -4 -1 Q6 -1 6 8"/>
      <path d="M6 8 L15 8 Q19 8 19 12 Q19 16 15 16 L2 16"/>
    </g>
    <text x="1000" y="270" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Escalate</text>
    <text x="1000" y="294" font-size="13" fill="#6b7280" text-anchor="middle">Human steps in</text>
    <text x="1000" y="311" font-size="13" fill="#6b7280" text-anchor="middle">only when stuck</text>
  </g>

  <!-- ===== Legend: how the pieces talk ===== -->
  <line x1="330" y1="410" x2="480" y2="410" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="415" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">How the pieces talk</text>
  <line x1="720" y1="410" x2="870" y2="410" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="392" cy="452" r="6" fill="#2f6fed"/>
  <text x="408" y="457" font-size="14" font-weight="600" fill="#111827">gRPC</text>
  <text x="452" y="457" font-size="14" fill="#6b7280">internal</text>

  <circle cx="570" cy="452" r="6" fill="#9ca3af"/>
  <text x="586" y="457" font-size="14" font-weight="600" fill="#111827">REST</text>
  <text x="630" y="457" font-size="14" fill="#6b7280">agents</text>

  <circle cx="740" cy="452" r="6" fill="#5b93f0"/>
  <text x="756" y="457" font-size="14" font-weight="600" fill="#111827">GraphQL</text>
  <text x="828" y="457" font-size="14" fill="#6b7280">dashboard</text>

  <!-- ===== Footer ===== -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="592" font-size="12" font-weight="600" letter-spacing="2" fill="#9ca3af" text-anchor="middle">TRAILMARKED — LEARN ONCE. REUSE FOREVER.</text>
</svg>
